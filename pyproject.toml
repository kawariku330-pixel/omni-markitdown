[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-markitdown"
version = "1.1.1"
description = "最強のマルチモーダルMarkdown変換・構造化エンジン (MarkItDown + NDLOCR-Lite)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "omni_markitdown/_vendor/ndlocr_lite/LICENCE",
    "omni_markitdown/_vendor/ndlocr_lite/LICENCE_DEPENDENCIES",
    "omni_markitdown/_vendor/ndlocr_lite/NOTICE.md",
]
authors = [
    {name = "kawariku330-pixel"}
]
dependencies = [
    # pptx / xlsx / xls は MarkItDown の追加パッケージが無いと読めない
    "markitdown[pptx,xlsx,xls]>=0.1.0",
    "python-docx>=1.0.0",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
# OCR: 同封の ndlocr-lite（omni_markitdown/_vendor/ndlocr_lite）が使う部品。
# opencv 4.12 以降は numpy 2 を必須にするので、本体の numpy を上げないよう 4.12 未満にする
ocr = [
    "onnxruntime>=1.16",
    "opencv-python-headless>=4.8,<4.12",
    "pyyaml>=6.0",
    "lxml>=4.9",
    "tqdm>=4.60",
    "networkx>=3.0",
]
audio = [
    "faster-whisper>=1.0.0",
    "soundfile>=0.12.0",
]
all = [
    "omni-markitdown[ocr,audio]",
]

[project.scripts]
omni-markitdown = "omni_markitdown.cli:main"

[tool.setuptools.package-data]
# 同封の ndlocr-lite（モデル・設定・ライセンス）
omni_markitdown = ["_vendor/ndlocr_lite/**/*"]

[tool.setuptools.packages.find]
include = ["omni_markitdown*"]
exclude = ["作業用*", "tests*"]
